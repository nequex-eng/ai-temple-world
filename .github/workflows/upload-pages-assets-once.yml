name: One-time Pages asset upload
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upload-pages-assets-once.yml"
jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Upload the latest production asset set
        run: |
          curl -fsS -X POST \
            https://temple-pages-upload-3ccc0f5a.nequex.workers.dev/upload \
            -o /tmp/pages-assets-upload.json
          echo "Latest source bundle"
          cat /tmp/pages-assets-upload.json
