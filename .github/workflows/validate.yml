name: Validate temple world
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax, smoke tests and build
        run: npm test
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start production-like local Pages server
        run: |
          nohup node scripts/serve-pages.mjs >/tmp/temple-pages.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ -o /tmp/local-pages.html; then
              if grep -q 'profile-sound-toggle' /tmp/local-pages.html; then
                echo "Local Pages preview is ready and contains the first-visit sound control"
                exit 0
              fi
              echo "The generated Pages HTML is missing profile-sound-toggle"
              exit 1
            fi
            sleep 1
          done
          cat /tmp/temple-pages.log
          exit 1
      - name: Verify real audio playback in the current build
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/audio.spec.js
      - name: Inspect the public Pages response
        run: |
          echo "Canonical Pages domain:"
          curl -sS -L -D /tmp/canonical.headers https://helixtemple.pages.dev/ -o /tmp/canonical.html
          cat /tmp/canonical.headers
          head -c 900 /tmp/canonical.html
          echo
          grep -q 'id="loading"' /tmp/canonical.html
      - name: Test current build against production APIs in desktop and mobile browsers
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e
      - name: Save browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanctuary-browser-test-report
          path: test-results/
          if-no-files-found: ignore
