name: One-time temple Pages asset upload
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upload-temple-assets-once.yml"
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Upload assets and print deployment manifest
        run: |
          curl -fsS -X POST https://temple-pages-upload-20261114.nequex.workers.dev/upload | tee manifest.json
      - name: Save manifest
        uses: actions/upload-artifact@v4
        with:
          name: temple-pages-manifest
          path: manifest.json
