name: One-time temple Pages asset upload
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upload-temple-assets-once.yml"
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Upload updated app and world modules
        run: curl -fsS -X POST https://temple-pages-upload-20261114c.nequex.workers.dev/upload | tee manifest.json
