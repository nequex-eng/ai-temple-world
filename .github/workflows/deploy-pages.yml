name: Deploy Cloudflare Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run validation, smoke tests and build
        run: npm test
      - name: Check Cloudflare deploy credential
        id: credential
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy production site
        if: steps.credential.outputs.configured == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name helixtemple --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c76b79d615b6bc886fe564307682767
      - name: Await one-time credential setup
        if: steps.credential.outputs.configured != 'true'
        run: echo "Automatic deployment is prepared. Add the CLOUDFLARE_API_TOKEN repository secret to enable it."
