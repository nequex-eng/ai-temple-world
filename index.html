const avatar=new THREE.Group();scene.add(avatar);let robeMat=mat(0xb49a72),skinMat=mat(0xd7ad87);let body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,4,8),robeMat);body.position.y=1.25;body.castShadow=true;avatar.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),skinMat);head.position.y=2.15;head.castShadow=true;avatar.add(head);let legL=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.5,3,6),robeMat),legR=legL.clone();legL.position.set(-.22,.35,0);legR.position.set(.22,.35,0);avatar.add(legL,legR);let armL=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.58,3,6),robeMat),armR=armL.clone();armL.position.set(-.52,1.3,0);armR.position.set(.52,1.3,0);armL.rotation.z=-.22;armR.rotation.z=.22;avatar.add(armL,armR);const nameSprite=()=>{let c=document.createElement('canvas');c.width=256;c.height=64;let ctx=c.getContext('2d');ctx.fillStyle='#f3dfb8';ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText(profile?.name||'行者',128,42);let t=new THREE.CanvasTexture(c);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.scale.set(2.4,.6,1);s.position.y=3;return s};let label=nameSprite();avatar.add(label);avatar.position.set(0,0,18);

function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04),now=performance.now();if(now>actionUntil&&state!=='walk'){setState('walk')}let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joyVec.y;let side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyVec.x;let moving=Math.abs(f)+Math.abs(side)>.08;if(moving&&state==='walk'){let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));walkDir.copy(forward).multiplyScalar(f).add(right.multiplyScalar(side)).normalize();let speed=keys.shift?8:4.5;let nx=avatar.position.x+walkDir.x*speed*dt,nz=avatar.position.z+walkDir.z*speed*dt;let blocked=colliders.some(([x,z,w,d])=>Math.abs(nx-x)<w/2+1&&Math.abs(nz-z)<d/2+1);if(!blocked){avatar.position.x=THREE.MathUtils.clamp(nx,-78,78);avatar.position.z=THREE.MathUtils.clamp(nz,-78,78)}avatar.rotation.y=Math.atan2(walkDir.x,walkDir.z);steps+=Math.round(speed*dt*2);$('steps').textContent=steps+' 步';legL.rotation.x=Math.sin(now*.012)*.55;legR.rotation.x=-legL.rotation.x;armL.rotation.x=-legL.rotation.x*.45;armR.rotation.x=-legR.rotation.x*.45}
